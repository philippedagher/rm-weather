name: Render weather sleep screen

on:
  schedule:
    # Target: 06:00, 12:00, 16:00, 21:00 Beirut time. Lebanon is UTC+3 in summer and
    # UTC+2 in winter, so both UTC candidates are listed and the "gate" step below
    # skips the run whose Beirut hour is not one of the four.
    - cron: "2 3,4,9,10,13,14,18,19 * * *"
    # Polls for a "Refresh image" request from the payadapt weather modal. This
    # one never redraws on its own -- it only acts when a request postdates the
    # published image -- so it is cheap despite firing often.
    - cron: "*/10 * * * *"
  workflow_dispatch:           # lets you run it by hand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether to render (by staleness, not clock hour)
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          HOME_SLUG: ${{ vars.HOME_SLUG || 'dagher' }}
          POLL_CRON: "*/10 * * * *"
          # How old the published image must be before a scheduled run redraws it.
          #
          # This replaced a gate that compared the current Beirut hour against
          # 06/12/16/21. That only worked if cron was punctual, and it is not:
          # GitHub delivered these runs 1-2 h late, by which point the Beirut
          # hour had moved on and every scheduled run skipped itself. Renders
          # only ever happened on pushes.
          #
          # Staleness has no such assumption. The four intended renders are at
          # least 4 h apart (09->13 UTC in summer) and the two UTC candidates for
          # one Beirut slot are 1 h apart, so any threshold between 60 and 240
          # minutes yields four renders a day and collapses the DST pair --
          # however late the run actually arrives.
          MAX_AGE_MIN: "210"
        run: |
          set -u
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "event=${{ github.event_name }} -> render"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LAST=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
                      -H "Accept: application/vnd.github+json" \
                      "https://api.github.com/repos/${{ github.repository }}/branches/output" \
                 | jq -r '.commit.commit.committer.date // empty' 2>/dev/null || true)
          if [ -z "$LAST" ]; then
            echo "no published image yet -> render"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PUBLISHED_TS=$(date -u -d "$LAST" +%s)
          AGE=$(( ( $(date -u +%s) - PUBLISHED_TS ) / 60 ))
          echo "published $LAST -> $AGE min old (threshold $MAX_AGE_MIN)"
          echo "Beirut now $(TZ=Asia/Beirut date '+%F %H:%M')"

          # An explicit "Refresh image" press in payadapt beats every other rule.
          # It is consumed implicitly: publishing moves the image's timestamp past
          # the request, so the same press cannot trigger a second render.
          REQUESTED=""
          if [ -n "${SUPABASE_URL:-}" ] && [ -n "${SUPABASE_ANON_KEY:-}" ]; then
            REQUESTED=$(curl -sS -X POST \
              "${SUPABASE_URL%/}/rest/v1/rpc/get_remarkable_weather_config" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"p_slug\":\"$HOME_SLUG\"}" \
              | jq -r '.[0].render_requested_at // empty' 2>/dev/null || true)
          fi
          if [ -n "$REQUESTED" ]; then
            REQUESTED_TS=$(date -u -d "$REQUESTED" +%s 2>/dev/null || echo 0)
            echo "refresh requested at $REQUESTED"
            if [ "$REQUESTED_TS" -gt "$PUBLISHED_TS" ]; then
              echo "requested after the published image -> render"
              echo "run=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "request already satisfied by the published image"
          fi

          # The frequent poll exists only to catch requests; it never redraws on
          # staleness, or it would replace the four-a-day cadence with one render
          # every MAX_AGE_MIN.
          if [ "${{ github.event.schedule }}" = "$POLL_CRON" ]; then
            echo "poll run, nothing requested -> skip"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$AGE" -ge "$MAX_AGE_MIN" ]; then
            echo "stale -> render"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "fresh enough -> skip"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"

      - run: pip install pillow
        if: steps.gate.outputs.run == 'true'

      - name: Render PNG from Open-Meteo
        if: steps.gate.outputs.run == 'true'
        # The location comes from the payadapt home whose slug is HOME_SLUG, via
        # the get_remarkable_weather_config RPC. If these secrets are absent or
        # the call fails, render_weather.py falls back to its built-in Batroun
        # coordinates, so the sleep screen never goes blank. Both values are
        # safe to hold as secrets: the anon key is a public client key and the
        # RPC only exposes homes that opted in.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          HOME_SLUG: ${{ vars.HOME_SLUG || 'dagher' }}
        run: python3 render_weather.py --out /tmp/weather.png

      - name: Publish to the "output" branch (single commit, no history growth)
        if: steps.gate.outputs.run == 'true'
        run: |
          set -e
          mkdir /tmp/out && cd /tmp/out
          git init -q -b output
          git config user.name  "weather-bot"
          git config user.email "weather-bot@users.noreply.github.com"
          cp /tmp/weather.png .
          git add weather.png
          git commit -q -m "weather $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" output
